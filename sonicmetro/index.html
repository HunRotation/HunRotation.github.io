<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicMetro: Seoul Subway Sonification</title>
    <link rel="stylesheet" href="css/style.css?v=16">
    <!-- Load D3 first -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Modules (ES6) -->
    <!-- Modules (ES6) -->
    <script type="module" src="js/main.js?v=30"></script>
</head>

<body>
    <div id="app">
        <div id="map-container">
            <!-- SVG Map will be injected here -->
        </div>

        <div id="chuck-loading-msg">WebChucK is loading...</div>

        <div id="left-panel">
            <div id="day-group">
                <button id="day-toggle" class="ui-button">평일</button>
            </div>
            <div id="time-group">
                <input type="range" id="time-slider" min="0" max="100" step="1" value="0">
                <div id="time-display-left">05:00:00</div>
            </div>

            <div id="sound-test-panel"
                style="margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.9); border-radius: 8px;">
                <h4 style="margin: 0 0 10px 0; font-size: 14px;">Sound Samples</h4>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button class="test-dot" data-line="1호선"
                        style="width:20px; height:20px; border-radius:50%; background:#0052A4; border:none; cursor:pointer;"
                        title="1호선"></button>
                    <button class="test-dot" data-line="2호선"
                        style="width:20px; height:20px; border-radius:50%; background:#00A84D; border:none; cursor:pointer;"
                        title="2호선"></button>
                    <button class="test-dot" data-line="3호선"
                        style="width:20px; height:20px; border-radius:50%; background:#EF7C1C; border:none; cursor:pointer;"
                        title="3호선"></button>
                    <button class="test-dot" data-line="4호선"
                        style="width:20px; height:20px; border-radius:50%; background:#00A4E3; border:none; cursor:pointer;"
                        title="4호선"></button>
                    <button class="test-dot" data-line="5호선"
                        style="width:20px; height:20px; border-radius:50%; background:#996CAC; border:none; cursor:pointer;"
                        title="5호선"></button>
                    <button class="test-dot" data-line="6호선"
                        style="width:20px; height:20px; border-radius:50%; background:#CD7C2F; border:none; cursor:pointer;"
                        title="6호선"></button>
                    <button class="test-dot" data-line="7호선"
                        style="width:20px; height:20px; border-radius:50%; background:#747F00; border:none; cursor:pointer;"
                        title="7호선"></button>
                    <button class="test-dot" data-line="8호선"
                        style="width:20px; height:20px; border-radius:50%; background:#E6186C; border:none; cursor:pointer;"
                        title="8호선"></button>
                    <button class="test-dot" data-line="9호선"
                        style="width:20px; height:20px; border-radius:50%; background:#BDB092; border:none; cursor:pointer;"
                        title="9호선"></button>
                    <button class="test-dot" data-line="경의중앙선"
                        style="width:20px; height:20px; border-radius:50%; background:#77C4A3; border:none; cursor:pointer;"
                        title="경의중앙선"></button>
                </div>
            </div>
        </div>

        <div id="station-list-panel">
            <h3>Active Stations</h3>
            <textarea id="debug-log"
                style="display:none; width:100%; height:150px; margin-top:10px; font-family:monospace; font-size:12px;"
                placeholder="Clicked coordinates will appear here..."></textarea>
            <div id="station-list-content">
                <div class="empty-state">Click stations to enable</div>
            </div>
        </div>


        <div id="controls">
            <h1>SonicMetro</h1>
            <div id="status-panel">
                <div id="clock">05:00:00</div>
                <button id="btn-play">Play</button>
                <button id="btn-pause">Pause</button>
                <button id="btn-reset">Reset</button>
                <button id="btn-export">Export Schedule</button>
                <div class="slider-container">
                    <label for="speed-range">Speed: <span id="speed-val">1x</span></label>
                    <input type="range" id="speed-range" min="0.1" max="10" step="0.1" value="1">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->

</body>

</html>
