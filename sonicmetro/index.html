<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicMetro: Seoul Subway Sonification</title>
    <link rel="stylesheet" href="css/style.css?v=16">
    <!-- Load D3 first -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- Modules (ES6) -->
    <!-- Modules (ES6) -->
    <script type="module" src="js/main.js?v=30"></script>
</head>

<body>
    <div id="app">
        <div id="map-container">
            <!-- SVG Map will be injected here -->
        </div>

        <div id="left-panel">
            <div id="day-group">
                <button id="day-toggle" class="ui-button">평일</button>
            </div>
            <div id="time-group">
                <input type="range" id="time-slider" min="0" max="100" step="1" value="0">
                <div id="time-display-left">05:00:00</div>
            </div>
        </div>

        <div id="station-list-panel">
            <h3>Active Stations</h3>
            <div id="station-list-content">
                <div class="empty-state">Click stations to enable</div>
            </div>
        </div>


        <div id="controls">
            <h1>SonicMetro</h1>
            <div id="status-panel">
                <div id="clock">05:00:00</div>
                <button id="btn-play">Play</button>
                <button id="btn-pause">Pause</button>
                <button id="btn-reset">Reset</button>
                <button id="btn-export">Export Schedule</button>
                <div class="slider-container">
                    <label for="speed-range">Speed: <span id="speed-val">1x</span></label>
                    <input type="range" id="speed-range" min="0.1" max="10" step="0.1" value="1">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js?v=14"></script>
</body>

</html>
